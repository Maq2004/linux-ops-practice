name: hello-ci

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看工作目录
        run: ls -la

      - name: 查看docker
        run: docker version

      - name: 谁在跑
        run: |
          echo "repo     : $GITHUB_REPOSITORY"
          echo "commit   : $GITHUB_SHA"
          echo "branch   : $GITHUB_REF_NAME"
          echo "runner   : $RUNNER_OS"

      - name: 计算短 SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 构建镜像
        run: |
          docker build -t ops-demo:${{ steps.vars.outputs.short_sha }} ./ansible-lab/target
          docker images | grep ops-demo

