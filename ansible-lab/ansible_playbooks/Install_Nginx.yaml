---
- name: install and configure nginx
  hosts: web
  become: true
  vars_files:
    - vars/web.yml
  tasks:
    - name: install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      

    - name: ensure nginx is running
      ansible.builtin.command: nginx
      args: 
        creates: /run/nginx.pid
    
    - name: deploy index page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ site_root }}/index.html"
        mode: "0644"
      notify: reload nginx
  

    - name: mark only web01
      ansible.builtin.file:
        path: /tmp/only-web01.txt
        state: touch
        mode: "0644"
      when: inventory_hostname == "web01"
    
    - name: create sites dirs
      ansible.builtin.file:
        path: "{{ site_root }}/{{ item }}"
        state: directory
        mode: "{{ site_mode }}"
      loop: [site-a, site-b, site-c]

  handlers:
    - name: reload nginx
      ansible.builtin.command: nginx -s reload







