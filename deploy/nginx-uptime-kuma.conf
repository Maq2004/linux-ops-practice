# /etc/nginx/sites-available/uptime-kuma
# 说明：443 SSL 是演示入口；证书路径按实际替换。
# 如果 443 已被占用，改成其他端口并同步放行安全组；本环境 80 被 Apache 占用，不要用 80。
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/kuma.crt;
    ssl_certificate_key /etc/nginx/ssl/kuma.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/uptime-kuma.access.log;
    error_log  /var/log/nginx/uptime-kuma.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Uptime Kuma 使用 WebSocket，必须转发 Upgrade/Connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kuma 的长连接/监控页面
        proxy_read_timeout 3600s;
    }
}
